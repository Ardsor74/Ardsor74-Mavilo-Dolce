    @keyframes slideUp { from{transform:translateY(100%)} to{transform:translateY(0)} }
    .cookie-text { font-family:'Lato'; font-size:0.78rem; color:rgba(255,255,255,0.65); line-height:1.75; flex:1 1 280px; letter-spacing:0.02em; }
    .cookie-text a { color:#D4AF37; text-decoration:underline; }
    .cookie-btns { display:flex; gap:0.6rem; flex-wrap:wrap; flex-shrink:0; }
    .cookie-accept { font-family:'Lato'; font-size:0.68rem; letter-spacing:0.16em; text-transform:uppercase; background:#D4AF37; color:#1A1A1A; border:none; padding:0.7rem 1.4rem; cursor:pointer; min-height:40px; font-weight:700; transition:background 0.2s; }
    .cookie-accept:hover { background:#c9a52e; }
    .cookie-reject { font-family:'Lato'; font-size:0.68rem; letter-spacing:0.16em; text-transform:uppercase; background:transparent; color:rgba(255,255,255,0.35); border:1px solid rgba(255,255,255,0.12); padding:0.7rem 1.2rem; cursor:pointer; min-height:40px; transition:all 0.2s; }
    .cookie-reject:hover { color:rgba(255,255,255,0.7); border-color:rgba(255,255,255,0.3); }

    /* — Privacy Modal — */
    .privacy-overlay { position:fixed; inset:0; background:rgba(8,8,8,0.96); z-index:9000; display:flex; align-items:center; justify-content:center; padding:1rem; animation:fadeIn 0.3s ease; }
    @keyframes fadeIn { from{opacity:0} to{opacity:1} }
    .privacy-card { background:#111; border:1px solid rgba(212,175,55,0.25); width:100%; max-width:720px; max-height:88vh; display:flex; flex-direction:column; animation:scaleIn 0.3s ease; }
    .privacy-head { padding:1.5rem 2rem; border-bottom:1px solid rgba(212,175,55,0.12); display:flex; align-items:center; justify-content:space-between; flex-shrink:0; }
    .privacy-body { overflow-y:auto; padding:1.5rem 2rem 2rem; -webkit-overflow-scrolling:touch; flex:1; }
    .privacy-body h3 { font-family:'Playfair Display',serif; font-style:italic; font-size:1rem; color:#D4AF37; margin:1.4rem 0 0.5rem; font-weight:400; }
    .privacy-body h3:first-child { margin-top:0; }
    .privacy-body p { font-family:'Lato'; font-size:0.82rem; color:#888; line-height:1.9; margin-bottom:0.6rem; }
    .privacy-body strong { color:#bbb; }

    /* — Google Reviews button — */
    .btn-reviews { font-family:'Lato'; font-size:0.7rem; letter-spacing:0.15em; text-transform:uppercase; background:transparent; color:#4285F4; border:1px solid rgba(66,133,244,0.35); padding:0.85rem 1.4rem; cursor:pointer; min-height:44px; display:inline-flex; align-items:center; justify-content:center; gap:8px; transition:all 0.25s; text-decoration:none; }
    .btn-reviews:hover { background:rgba(66,133,244,0.08); border-color:#4285F4; }

    /* — Calendar admin — */
    .cal-day { aspect-ratio:1; display:flex; align-items:center; justify-content:center; font-size:0.76rem; cursor:pointer; border-radius:3px; transition:all 0.18s; font-family:'Lato'; color:#bbb; min-height:34px; -webkit-tap-highlight-color:transparent; }
    .cal-day:hover:not(.cal-blocked):not(.cal-past) { background:rgba(212,175,55,0.18); color:#D4AF37; }
    .cal-day.cal-blocked { background:rgba(120,120,120,0.25); color:#888; font-weight:700; border:1px solid rgba(150,150,150,0.4); cursor:pointer; }
    .cal-day.cal-blocked::after { content:' ✕'; font-size:0.55rem; }
    .cal-day.cal-today { border:1px solid #D4AF37; color:#D4AF37; }
    .cal-day.cal-past { opacity:0.22; cursor:default; pointer-events:none; }

    /* — Admin overlay — */
    .admin-wrap { position:fixed; inset:0; background:rgba(8,8,8,0.99); z-index:2000; overflow-y:auto; -webkit-overflow-scrolling:touch; }
    .admin-inner { max-width:860px; margin:0 auto; padding:1.5rem 1.25rem 4rem; }
    @media(min-width:640px){ .admin-inner { padding:2.5rem 2rem 4rem; } }

    /* — Login — */
    .login-wrap { position:fixed; inset:0; background:rgba(8,8,8,0.99); z-index:2000; display:flex; align-items:center; justify-content:center; padding:1rem; }
    .login-card { background:#111; border:1px solid rgba(212,175,55,0.28); padding:2.5rem 2rem; width:100%; max-width:400px; animation:scaleIn 0.3s ease; }
    @keyframes scaleIn { from{opacity:0;transform:scale(0.96)} to{opacity:1;transform:scale(1)} }

    /* — Recap row — */
    .recap-row { display:flex; justify-content:space-between; align-items:center; padding:0.48rem 0; border-bottom:1px solid rgba(212,175,55,0.1); font-family:'Lato'; font-size:0.82rem; }
    .recap-key { color:#aaa; } .recap-val { color:#1A1A1A; font-weight:700; }
    /* — Petali cadenti — */
    .petal { position:absolute; pointer-events:none; opacity:0; animation: petalFall linear infinite; backface-visibility:hidden; contain:strict; }
    /* Disabilita petali su mobile per performance */
    @media(max-width:767px){ .petal { display:none !important; } }
    @media(prefers-reduced-motion:reduce){ .petal { display:none !important; } }
    @keyframes petalFall {
      0%   { opacity:0; transform: translateY(-20px) rotate(0deg) scale(0.8); }
      10%  { opacity:0.7; }
      90%  { opacity:0.4; }
      100% { opacity:0; transform: translateY(100vh) rotate(720deg) scale(1.1) translateX(60px); }
    }

    /* — Come funziona — */
    .step-card { background:#FFF; border:1px solid rgba(212,175,55,0.18); padding:clamp(1.5rem,4vw,2.2rem); position:relative; transition:border-color 0.3s, box-shadow 0.3s; }
    .step-card:hover { border-color:rgba(212,175,55,0.5); box-shadow:0 8px 32px rgba(0,0,0,0.06); }
    .step-num { font-family:'Playfair Display',serif; font-size:clamp(2.5rem,6vw,4rem); font-weight:400; color:rgba(212,175,55,0.15); line-height:1; position:absolute; top:1rem; right:1.2rem; }

    /* — Prezzi — */
    .price-card { border:1px solid rgba(212,175,55,0.2); padding:clamp(1.5rem,4vw,2.5rem); background:#FFF; transition:all 0.3s; position:relative; overflow:hidden; }
    .price-card::before { content:''; position:absolute; top:0; left:0; right:0; height:2px; background:linear-gradient(90deg, transparent, #D4AF37, transparent); opacity:0; transition:opacity 0.3s; }
    .price-card:hover { border-color:rgba(212,175,55,0.5); box-shadow:0 12px 40px rgba(0,0,0,0.07); }
    .price-card:hover::before { opacity:1; }
    .price-card.featured { border-color:#D4AF37; }
    .price-card.featured::before { opacity:1; }
    .price-tag { font-family:'Playfair Display',serif; font-size:clamp(1.6rem,4vw,2.2rem); font-weight:400; color:#D4AF37; line-height:1; }
    .price-from { font-family:'Lato'; font-size:0.62rem; letter-spacing:0.18em; text-transform:uppercase; color:#aaa; display:block; margin-bottom:0.3rem; }

  </style>

function useCmsGallery() {
  const [items, setItems] = useState(null); // null = loading
  useEffect(() => {
    fetch('/gallery-data.json')
      .then(r => r.ok ? r.json() : [])
      .then(data => {
        if (Array.isArray(data) && data.length > 0) {
          const mapped = data.map((item, i) => ({
            id: i + 1,
            src: item.data?.image || item.data?.video || '',
            video: item.data?.video || null,
            link: item.data?.link_esterno || null,
            tipo: item.data?.tipo || 'foto',
            titolo: item.data?.title || '',
            categoria: item.data?.category || '',
            tall: i % 3 === 0,
          }));

/* ── useReveal hook ── */
// Observer globale — creato una volta sola
let _revealObs = null;
function getRevealObserver() {
  if (!_revealObs) {
    _revealObs = new IntersectionObserver(entries => {
      entries.forEach(e => {
        if (e.isIntersecting) {
          e.target.classList.add('visible');
          _revealObs.unobserve(e.target);
        }
      });
    }, { threshold: 0.1, rootMargin: '0px 0px -40px 0px' });
  }
  return _revealObs;
}

function useReveal() {
  useEffect(() => {
    const obs = getRevealObserver();
    const els = document.querySelectorAll('.reveal:not(.visible)');
    els.forEach(el => obs.observe(el));
    // no cleanup — observer è globale e persistente
  }, []);
}

/* ── Animated Counter hook ── */
function useCountUp(target, duration = 1600) {
  const [count, setCount] = useState(0);
  const ref = useRef(null);
  const started = useRef(false);

  useEffect(() => {
    if (!ref.current) return;
    const isNum = !isNaN(parseInt(target));
    if (!isNum) { setCount(target); return; }

    const obs = new IntersectionObserver(([entry]) => {
      if (entry.isIntersecting && !started.current) {
        started.current = true;
        obs.disconnect();
        const end = parseInt(target);
        const startTime = performance.now();
        const tick = (now) => {
          const elapsed = now - startTime;
          const progress = Math.min(elapsed / duration, 1);
          // easeOutQuart
          const ease = 1 - Math.pow(1 - progress, 4);
          setCount(Math.floor(ease * end));
          if (progress < 1) requestAnimationFrame(tick);
          else setCount(end);
        };
        requestAnimationFrame(tick);
      }
    }, { threshold: 0.3 });
    obs.observe(ref.current);
    return () => obs.disconnect();
  }, [target, duration]);

  return [count, ref];
}

/* ── LIGHTBOX with touch ── */
function Lightbox({ items, idx, onClose, onPrev, onNext }) {
  const item = items[idx];
  const touchX = useRef(null);
  const touchY = useRef(null);
  const scrollY = useRef(0);

  useEffect(() => {
    scrollY.current = window.scrollY;
    document.body.style.overflow = 'hidden';
    document.body.style.position = 'fixed';
    document.body.style.top = `-${scrollY.current}px`;
    document.body.style.width = '100%';
    const h = e => {
      if(e.key==='Escape') onClose();
      if(e.key==='ArrowLeft') onPrev();
      if(e.key==='ArrowRight') onNext();
    };
    window.addEventListener('keydown', h);
    return () => {
      window.removeEventListener('keydown', h);
      document.body.style.overflow = '';
      document.body.style.position = '';
      document.body.style.top = '';
      document.body.style.width = '';
      window.scrollTo(0, scrollY.current);
    };
  }, []);

  const onTouchStart = e => {
    touchX.current = e.touches[0].clientX;
    touchY.current = e.touches[0].clientY;
  };
  const onTouchEnd = e => {
    if(touchX.current === null) return;
    const dx = e.changedTouches[0].clientX - touchX.current;
    const dy = Math.abs(e.changedTouches[0].clientY - touchY.current);
    if(Math.abs(dx) > 50 && dy < 60) { dx > 0 ? onPrev() : onNext(); }
    touchX.current = null; touchY.current = null;
  };

  // Stile bottone riutilizzabile
  const btnStyle = (extra={}) => ({
    position:'fixed', zIndex:2147483647,
    background:'rgba(10,10,10,0.85)',
    border:'1px solid rgba(212,175,55,0.4)',
    color:'rgba(255,255,255,0.75)',
    cursor:'pointer', display:'flex',
    alignItems:'center', justifyContent:'center',
    width:52, height:52,
    padding:0, WebkitTapHighlightColor:'transparent',
    ...extra
  });

  const content = (
    <div
      onTouchStart={onTouchStart}
      onTouchEnd={onTouchEnd}
      style={{
        position:'fixed', inset:0,
        zIndex:2147483646,
        background:'rgba(5,5,5,0.97)',
        display:'flex', alignItems:'center', justifyContent:'center',
        overscrollBehavior:'contain',
      }}
      onClick={onClose}
      role="dialog" aria-modal="true" aria-label="Galleria immagini"
    >
      {/* Bottone CHIUDI — angolo in alto a destra */}
      <button
        style={btnStyle({ top:12, right:12, borderRadius:2 })}
        onClick={e => { e.stopPropagation(); onClose(); }}
        aria-label="Chiudi galleria"
      >
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2">
          <line x1="18" y1="6" x2="6" y2="18"/>
          <line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>

      {/* Freccia SINISTRA */}
      <button
        style={btnStyle({ top:'50%', left:10, transform:'translateY(-50%)' })}
        onClick={e => { e.stopPropagation(); onPrev(); }}
        aria-label="Immagine precedente"
      >
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
          <polyline points="15 18 9 12 15 6"/>
        </svg>
      </button>

      {/* Immagine + info */}
      <div
        onClick={e => e.stopPropagation()}
        style={{
          display:'flex', flexDirection:'column',
          alignItems:'center', gap:'0.8rem',
          padding:'70px 70px 20px',
          maxWidth:'100vw', maxHeight:'100dvh',
          boxSizing:'border-box',
        }}
      >
        <img
          key={idx}
          src={item.src}
          alt={`MAVILO DOLCE creazione ${item.id}`}
          style={{
            display:'block',
            maxWidth:'min(90vw, 900px)',
            maxHeight:'calc(100dvh - 130px)',
            width:'auto', height:'auto',
            objectFit:'contain',
            animation:'lbFadeIn 0.22s ease',
          }}
        />
        {/* Counter */}
        <div style={{
          fontFamily:'Lato,sans-serif', fontSize:'0.65rem',
          letterSpacing:'0.22em', color:'rgba(255,255,255,0.3)',
          flexShrink:0,
        }}>
          {idx+1} / {items.length}
        </div>
        {/* Dots */}
        <div style={{display:'flex', gap:5, flexShrink:0}}>
          {items.map((_,i) => (
            <button key={i}
              onClick={e => { e.stopPropagation(); i<idx?onPrev():onNext(); }}
              aria-label={`Foto ${i+1}`}
              style={{
                width:i===idx?22:5, height:2,
                background:i===idx?'#D4AF37':'rgba(255,255,255,0.18)',
                border:'none', padding:0, cursor:'pointer',
                transition:'all 0.3s', minHeight:8, borderRadius:1,
              }}
            />
          ))}
        </div>
      </div>

      {/* Freccia DESTRA */}
      <button
        style={btnStyle({ top:'50%', right:10, transform:'translateY(-50%)' })}
        onClick={e => { e.stopPropagation(); onNext(); }}
        aria-label="Immagine successiva"
      >
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
          <polyline points="9 18 15 12 9 6"/>
        </svg>
      </button>
    </div>
  );

  // Portal: renderizza FUORI dal div#root, direttamente nel body
  return createPortal(content, document.body);
}

/* ── GALLERY ── */
function Gallery() {
  const cmsItems = useCmsGallery();
  const [lb, setLb] = useState(null);
  const [visible, setVisible] = useState(() => Array(20).fill(true));
  const [allChecked, setAllChecked] = useState(false);
  const loadCount = useRef(0);

  // Usa CMS se ha dati, altrimenti fallback alle foto statiche
  const hasCms = cmsItems !== null && cmsItems.length > 0;
  const ITEMS = hasCms ? cmsItems : GALLERY;
  const total = ITEMS.length;

  const handleResult = (i, ok) => {
    if (!ok) setVisible(v => { const n=[...v]; n[i]=false; return n; });
    loadCount.current += 1;
    if (loadCount.current >= total) setAllChecked(true);
  };

  // Mentre CMS carica, aspetta
  if (cmsItems === null) return null;

  const lbItems = ITEMS.filter((_,i) => visible[i]);
  const anyVisible = visible.some(Boolean);

            <div key={item.id} className="mason-item"
              style={{display: visible[i] ? 'block' : 'none'}}

              role="button" tabIndex={visible[i]?0:-1}
              aria-label={`Apri creazione ${item.titolo || item.id}`}
              onKeyDown={e=>e.key==='Enter'&&(()=>{const lbIdx=lbItems.findIndex(x=>x.id===item.id);if(lbIdx>=0)setLb(lbIdx);})()}>
              {item.tipo === 'video' && item.src ? (
                <video src={item.src} muted loop playsInline
                  className="mason-img" style={{aspectRatio:item.tall?'3/4':'4/3',width:'100%',objectFit:'cover'}}
                  onLoadedData={() => handleResult(i, true)}

              ) : item.tipo === 'link' && item.link ? (
                <iframe src={item.link.replace('watch?v=','embed/')}
                  className="mason-img" style={{aspectRatio:'16/9',width:'100%',border:'none'}}
                  allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                  onLoad={() => handleResult(i, true)}
                  onError={() => handleResult(i, false)}/>
              ) : (
                <img src={item.src} alt={`MAVILO DOLCE — ${item.titolo || 'creazione'}`}
                  className="mason-img" style={{aspectRatio:item.tall?'3/4':'4/3'}}
                  loading="lazy"
                  onLoad={() => handleResult(i, true)}
                  onError={() => handleResult(i, false)}/>
              )}
              <div className="mason-overlay" aria-hidden="true"/>
              {item.titolo && (
                <div className="mason-label" style={{position:'absolute',bottom:0,left:0,right:0,padding:'0.6rem',background:'rgba(0,0,0,0.55)',color:'#fff',fontFamily:'Lato',fontSize:'0.72rem',letterSpacing:'0.05em',opacity:0,transition:'opacity 0.3s'}}>
                  {item.titolo}
                </div>
              )}
            </div>
          ))}
        </div>
      </div>
      {lb !== null && lbItems.length > 0 && (
        <Lightbox items={lbItems} idx={lb} onClose={() => setLb(null)}

function Preventivo({ blocked }) {
  const [step, setStep] = useState(1);
  const [form, setForm] = useState({ data:'', invitati:'', tipologia:'', note:'', foto:null, prev:null });
  const [toast, setToast] = useState(null);
  const fileRef = useRef();
  const topRef = useRef();
  useReveal();

  const today = new Date().toISOString().split('T')[0];
  const isBlocked = d => {
    if(!d) return false;
    const dt = new Date(d+'T12:00:00');
    return (blocked||[]).some(b => sameDay(new Date(b+'T12:00:00'), dt));
  };

  const goStep = n => {
    setStep(n);
    setTimeout(() => topRef.current?.scrollIntoView({ behavior:'smooth', block:'start' }), 80);
  };

  const handleFile = e => {
    const f = e.target.files[0]; if(!f) return;
    if(f.size > 10*1024*1024) { setToast('File troppo grande (max 10MB) ✦'); return; }
    const r = new FileReader();
    r.onload = ev => setForm(fm => ({...fm, foto:f, prev:ev.target.result}));
    r.readAsDataURL(f);
  };

  const buildMsg = () => {
    const lines = [
      `✨ *Richiesta di Commissione — MAVILO DOLCE*`, ``,
      `Gentile Atelier,`,
      `mi permetto di contattarvi per commissionare una creazione:`, ``,
      `📅 *Data:* ${form.data ? fmtDate(form.data) : '—'}`,
      `👥 *Invitati:* ${form.invitati || '—'}`,
      `🎂 *Tipologia:* ${form.tipologia || '—'}`,
      form.note ? `📝 *Note:* ${form.note}` : null,
      ``, `Resto a disposizione per un incontro.`, `Con stima,`
    ].filter(x => x !== null).join('\n');
    return encodeURIComponent(lines);
  };

  const send = () => {
    try {
      const reqs = JSON.parse(localStorage.getItem('mavilo_req') || '[]');
      reqs.unshift({ ...form, prev:null, ts: new Date().toISOString() });
      localStorage.setItem('mavilo_req', JSON.stringify(reqs.slice(0,20)));
    } catch(e) {}
    window.open(`https://wa.me/${WA}?text=${buildMsg()}`, '_blank');
    setToast('Richiesta inviata con eleganza ✦');
  };

  const tipologie = ['Torta Nuziale','Torta Compleanno','Fiori di Zucchero','Sweet Table','Torta Corporate','Altro'];
  const stepLabels = ['Evento','Creazione','Dettagli'];

            Non esistono prezzi fissi, perché non esistono creazioni uguali. Ogni opera nasce da un dialogo.

        </div>

          {stepLabels.map((l,i) => (
            <React.Fragment key={i}>
              <div style={{display:'flex',flexDirection:'column',alignItems:'center',gap:'0.5rem'}}>
                <div className={`step-dot ${step>i+1?'done':step===i+1?'active':'idle'}`}
                  onClick={() => step > i+1 && goStep(i+1)}
                  role={step>i+1?'button':undefined} tabIndex={step>i+1?0:undefined}
                  aria-label={`Passo ${i+1}: ${l}`}>
                  {step > i+1 ? '✓' : i+1}
                </div>
                <span style={{fontFamily:'Lato',fontSize:'0.58rem',letterSpacing:'0.14em',textTransform:'uppercase',color:step===i+1?'#1A1A1A':'#ccc'}}>{l}</span>
              </div>
              {i < 2 && <div style={{flex:1,height:1,background:step>i+1?'#D4AF37':'rgba(26,26,26,0.12)',margin:'0 0.6rem',marginBottom:'1.5rem',transition:'background 0.4s'}} aria-hidden="true"/>}
            </React.Fragment>
          ))}
        </div>

        {/* Form card */}
        <div className="reveal" style={{background:'#FFF',border:'1px solid rgba(212,175,55,0.18)',padding:'clamp(1.5rem,6vw,3rem)'}}>
          {/* STEP 1 */}
          {step === 1 && (
            <div>
              <h3 style={{fontFamily:'Playfair Display,serif',fontStyle:'italic',fontSize:'clamp(1.2rem,2.5vw,1.45rem)',fontWeight:400,color:'#1A1A1A',marginBottom:'1.8rem'}}>Il Vostro Evento</h3>
              <div style={{display:'flex',flexDirection:'column',gap:'1.4rem'}}>
                <div>
                  <label className="f-label" htmlFor="event-date">Data dell'Evento *</label>
                  <input id="event-date" type="date" className="f-input" value={form.data} min={today}
                    onChange={e => setForm(f=>({...f,data:e.target.value}))}/>
                  {form.data && isBlocked(form.data) && (
                    <div style={{marginTop:'0.6rem',padding:'0.75rem 1rem',background:'rgba(192,57,43,0.07)',border:'1px solid rgba(192,57,43,0.25)',display:'flex',alignItems:'center',gap:'0.6rem'}} role="alert">
                      <span style={{fontSize:'1rem'}} aria-hidden="true">🔒</span>
                      <p style={{color:'#C0392B',fontFamily:'Lato',fontSize:'0.8rem',lineHeight:1.5,margin:0}}>
                        <strong>Spiacenti</strong>, per questa data l'Atelier è al completo.<br/>
                        <span style={{color:'#999',fontSize:'0.74rem'}}>Scegli un'altra data per la tua commissione.</span>
                      </p>
                    </div>
                  )}
                  {form.data && !isBlocked(form.data) && new Date(form.data+'T12:00:00') > new Date() && (
                    <p style={{color:'#2ecc71',fontFamily:'Lato',fontSize:'0.74rem',marginTop:'0.5rem',letterSpacing:'0.04em'}} role="status">✓ Data disponibile</p>
                  )}
                </div>
                <div>
                  <label className="f-label" htmlFor="event-guests">Numero di Invitati *</label>
                  <input id="event-guests" type="number" min="1" max="5000" className="f-input" placeholder="es. 80"
                    value={form.invitati} onChange={e=>setForm(f=>({...f,invitati:e.target.value}))}/>
                </div>
              </div>
              <button className="btn-primary" style={{width:'100%',marginTop:'2rem'}}
                onClick={() => {
                  if(!form.data || !form.invitati) { setToast('Compila tutti i campi ✦'); return; }
                  if(isBlocked(form.data)) { setToast('Data non disponibile ✦'); return; }
                  goStep(2);
                }}>Continua →</button>
            </div>
          )}

          {/* STEP 2 */}
          {step === 2 && (
            <div>
              <h3 style={{fontFamily:'Playfair Display,serif',fontStyle:'italic',fontSize:'clamp(1.2rem,2.5vw,1.45rem)',fontWeight:400,color:'#1A1A1A',marginBottom:'1.8rem'}}>La Vostra Creazione</h3>
              <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'0.6rem',marginBottom:'0.5rem'}} role="group" aria-label="Tipologia torta">
                {tipologie.map(t => (
                  <button key={t} className={`tipo-btn${form.tipologia===t?' active':''}`}
                    onClick={() => setForm(f=>({...f,tipologia:t}))}
                    aria-pressed={form.tipologia===t}>{t}</button>
                ))}
              </div>
              <div style={{display:'flex',gap:'0.6rem',marginTop:'1.5rem'}}>
                <button className="btn-ghost" style={{flex:1}} onClick={() => goStep(1)}>← Indietro</button>
                <button className="btn-primary" style={{flex:2}}
                  onClick={() => { if(!form.tipologia){setToast('Scegli la tipologia ✦');return;} goStep(3); }}>

                </button>
              </div>
            </div>
          )}

          {/* STEP 3 */}
          {step === 3 && (
            <div>
              <h3 style={{fontFamily:'Playfair Display,serif',fontStyle:'italic',fontSize:'clamp(1.2rem,2.5vw,1.45rem)',fontWeight:400,color:'#1A1A1A',marginBottom:'1.8rem'}}>Dettagli & Ispirazione</h3>

                <div>
                  <label className="f-label" htmlFor="form-note">Note e Visione (opzionale)</label>
                  <textarea id="form-note" className="f-input" rows={4} style={{resize:'vertical',lineHeight:1.75}}
                    placeholder="Descrivi colori, atmosfera, sogno..."
                    value={form.note} onChange={e=>setForm(f=>({...f,note:e.target.value}))}/>
                </div>
                <div>
                  <label className="f-label">Foto di Ispirazione (opzionale)</label>
                  <div onClick={() => fileRef.current.click()}

                    onMouseLeave={e=>e.currentTarget.style.background='rgba(212,175,55,0.025)'}
                    role="button" tabIndex={0} aria-label="Carica foto di ispirazione"
                    onKeyDown={e => e.key==='Enter' && fileRef.current.click()}>
                    {form.prev ? (
                      <img src={form.prev} alt="Anteprima foto ispirazione" style={{maxHeight:160,maxWidth:'100%',objectFit:'contain'}}/>
                    ) : (
                      <>
                        <div style={{fontSize:'1.3rem',color:'#D4AF37'}} aria-hidden="true">✦</div>
                        <span style={{fontFamily:'Lato',fontSize:'0.78rem',color:'#D4AF37',letterSpacing:'0.1em'}}>Carica immagine</span>
                        <span style={{fontFamily:'Lato',fontSize:'0.68rem',color:'#ccc'}}>JPG, PNG — max 10MB</span>
                      </>

                  </div>
                  {form.prev && (
                    <button onClick={() => setForm(f=>({...f,foto:null,prev:null}))}

                </div>
              </div>

              <div style={{margin:'1.8rem 0',padding:'1.3rem',background:'#FAFAF8',border:'1px solid rgba(212,175,55,0.16)'}} aria-label="Riepilogo richiesta">

                ))}
              </div>
              <div style={{display:'flex',gap:'0.6rem',flexWrap:'wrap'}}>
                <button className="btn-ghost" style={{flex:'1 1 auto'}} onClick={() => goStep(2)}>← Indietro</button>

                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
                  Invia su WhatsApp
                </button>
              </div>
            </div>
          )}
        </div>
      </div>
      {toast && <Toast msg={toast} onClose={() => setToast(null)}/>}
    </section>
  );
}

/* ── ADMIN CALENDAR ── */
function AdminCalendar({ blocked, setBlocked }) {
  const now = new Date();
  const [yr, setYr] = useState(now.getFullYear());
  const [mo, setMo] = useState(now.getMonth());
  const days = daysIn(yr, mo);
  const first = firstDay(yr, mo);
  const prevM = () => mo === 0 ? (setYr(y=>y-1), setMo(11)) : setMo(m=>m-1);
  const nextM = () => mo === 11 ? (setYr(y=>y+1), setMo(0)) : setMo(m=>m+1);
  const toggle = ds => {
    const u = blocked.includes(ds) ? blocked.filter(d=>d!==ds) : [...blocked, ds];
    setBlocked(u);
    try { localStorage.setItem('mavilo_blocked', JSON.stringify(u)); } catch(e) {}
  };
  return (
    <div>
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:'1.2rem'}}>
        <button onClick={prevM} className="lb-btn" aria-label="Mese precedente" style={{border:'1px solid rgba(212,175,55,0.25)',width:36,height:36}}><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5"><polyline points="15 18 9 12 15 6"/></svg></button>
        <span style={{fontFamily:'Playfair Display',fontStyle:'italic',color:'#fff',fontSize:'1rem'}}>{MONTHS[mo]} {yr}</span>
        <button onClick={nextM} className="lb-btn" aria-label="Mese successivo" style={{border:'1px solid rgba(212,175,55,0.25)',width:36,height:36}}><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5"><polyline points="9 18 15 12 9 6"/></svg></button>
      </div>
      <div style={{display:'grid',gridTemplateColumns:'repeat(7,1fr)',gap:3,marginBottom:'0.4rem'}} aria-hidden="true">
        {DNAMES.map(d=><div key={d} style={{textAlign:'center',fontFamily:'Lato',fontSize:'0.6rem',letterSpacing:'0.08em',color:'#555',padding:'0.3rem 0'}}>{d}</div>)}
      </div>
      <div style={{display:'grid',gridTemplateColumns:'repeat(7,1fr)',gap:3}} role="grid" aria-label={`Calendario ${MONTHS[mo]} ${yr}`}>
        {Array.from({length:first}).map((_,i) => <div key={`e${i}`} aria-hidden="true"/>)}
        {Array.from({length:days}).map((_,i) => {
          const day = i+1;
          const ds = `${yr}-${String(mo+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
          const d = new Date(yr, mo, day);
          const past = d < new Date(now.getFullYear(), now.getMonth(), now.getDate());
          const isT = sameDay(d, now);
          const isBlk = blocked.includes(ds);
          return <div key={day} className={`cal-day${isBlk?' cal-blocked':''}${isT?' cal-today':''}${past?' cal-past':''}`}
            onClick={() => !past && toggle(ds)}
            role="gridcell" aria-label={`${day} ${MONTHS[mo]} ${yr}${isBlk?' - Occupata':''}`}
            aria-pressed={isBlk}>{day}</div>;
        })}
      </div>

        <span style={{color:'rgba(255,255,255,0.25)'}}>Tocca per occupare/liberare</span>
      </div>
    </div>
  );
}

function AdminLogin({ onOk, onClose }) {
  const [pw, setPw] = useState('');
  const [err, setErr] = useState('');
  const [shake, setShake] = useState(false);
  useEffect(() => { document.body.style.overflow = 'hidden'; return () => { document.body.style.overflow = ''; }; }, []);
  const go = () => {
    if(btoa(pw) === PASS) { onOk(); }
    else { setErr('Codice non valido.'); setPw(''); setShake(true); setTimeout(()=>setShake(false),500); }
  };
  return (
    <div className="login-wrap" role="dialog" aria-modal="true" aria-label="Accesso area riservata">
      <div className="login-card" style={{transform:shake?'translateX(-6px)':'none',transition:'transform 0.1s'}}>

          <div style={{fontFamily:'Lato',fontSize:'0.6rem',letterSpacing:'0.42em',textTransform:'uppercase',color:'#D4AF37',marginBottom:'0.8rem'}}>Accesso Riservato</div>
          <div style={{fontFamily:'Playfair Display',fontStyle:'italic',color:'#fff',fontSize:'1.4rem',fontWeight:400}}>Gestione Atelier</div>
        </div>
        <label htmlFor="admin-pw" style={{display:'none'}}>Codice di accesso</label>
        <input id="admin-pw" type="password" placeholder="Codice di accesso" value={pw}
          onChange={e=>setPw(e.target.value)} onKeyDown={e=>e.key==='Enter'&&go()}
          className="f-input" style={{marginBottom:'0.5rem',background:'rgba(255,255,255,0.05)',border:'1px solid rgba(212,175,55,0.28)',color:'#fff',letterSpacing:'0.15em'}}
          autoComplete="current-password"/>
        {err && <p role="alert" style={{color:'#E74C3C',fontFamily:'Lato',fontSize:'0.74rem',marginBottom:'0.8rem',letterSpacing:'0.04em'}}>{err}</p>}
        <div style={{display:'flex',gap:'0.6rem',marginTop:'1rem'}}>
          <button onClick={onClose} className="btn-ghost" style={{flex:1,color:'#555',borderColor:'rgba(255,255,255,0.08)'}}>Annulla</button>
          <button onClick={go} className="btn-primary" style={{flex:2,background:'#D4AF37',color:'#1A1A1A'}}>Accedi</button>
        </div>
      </div>
    </div>
  );
}

    try { return JSON.parse(localStorage.getItem('mavilo_blocked') || '[]'); } catch { return []; }
  });

  /* Splash screen — fade-in 1.5s → pausa 1s → exit coperchio 1.5s */
  useEffect(() => {
    const loader = document.getElementById('loader');
    // Dopo 2.5s aggiungi classe exit (animazione 1.5s)
    const t1 = setTimeout(() => {
      if (loader) loader.classList.add('exit');
    }, 2500);
    // Dopo 4s totali rimuovi completamente
    const t2 = setTimeout(() => {
      if (loader) loader.style.display = 'none';
    }, 4000);
    return () => { clearTimeout(t1); clearTimeout(t2); };
  }, []);

  /* Active nav via scroll position */
  useEffect(() => {
    const secs = [
      {id:'home',         label:'Home'},
      {id:'latelier',     label:"Il Laboratorio"},
      {id:'gallery',      label:'Gallery'},
      {id:'stampe',       label:'Stampe'},
      {id:'comefunziona', label:'Preventivo'},
      {id:'faq',          label:'Preventivo'},
      {id:'preventivo',   label:'Preventivo'},
      {id:'contatti',     label:'Contatti'},
    ];
    const onScroll = () => {
      const offset = 120;
      const scrollY = window.scrollY + offset;
      let current = secs[0];
      for (const s of secs) {
        const el = document.getElementById(s.id);
        if (el && el.offsetTop <= scrollY) current = s;
      }
      setNav(current.label);
    };
    window.addEventListener('scroll', onScroll, { passive: true });
    onScroll();
    return () => window.removeEventListener('scroll', onScroll);
  }, []);

  const scrollTo = id => setTimeout(() => document.getElementById(id)?.scrollIntoView({behavior:'smooth'}), 50);

  return (
    <>
      <Nav active={nav} setActive={setNav}/>
      <Hero onCTA={() => scrollTo('preventivo')}/>
      <Numbers/>
      <Atelier/>
      <Gallery/>
      <VideoSection/>
      <Testimonial/>
      <StampeAlimentari/>
      <ComeFunziona/>
      <FAQ/>
      <Preventivo blocked={blocked}/>
      <Contatti/>
      <Footer onAdmin={() => setAdmin('login')} onPrivacy={() => setShowPrivacy(true)}/>
      <FloatWA/>
      <CookieBanner onPrivacy={() => setShowPrivacy(true)}/>
      {showPrivacy && <PrivacyModal onClose={() => setShowPrivacy(false)}/>}
      {admin === 'login' && <AdminLogin onOk={() => setAdmin('dash')} onClose={() => setAdmin(null)}/>}
      {admin === 'dash' && <AdminDash onClose={() => setAdmin(null)} blocked={blocked} setBlocked={setBlocked}/>}
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
<script>
  if (window.netlifyIdentity) {
    window.netlifyIdentity.on("init", function(user) {
      if (!user) {
        window.netlifyIdentity.on("login", function() {
          document.location.href = "/admin/";
        });
      }
    });
  }
</script>
</body>
</html>
