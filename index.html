  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
    body { font-family:'Lato',sans-serif; background:#FFF; color:#1A1A1A; overflow-x:hidden; touch-action:pan-y; overscroll-behavior-y:none; -webkit-overflow-scrolling:touch; }

    /* — Skip link (accessibilità) — */
    .skip-link { position:absolute; left:-9999px; top:0; background:#D4AF37; color:#1A1A1A; padding:0.5rem 1rem; font-family:'Lato'; font-size:0.8rem; z-index:99999; }

    /* — Scrollbar — */
    .scroll-hint { display: flex; }
    @media (max-height: 700px), (max-width: 480px) { .scroll-hint { display: none !important; } }

    /* — Loading Screen — */
    /* ══ SPLASH SCREEN AGGIORNATO E INGRANDITO ══ */
    #loader {
      position:fixed; top:0; left:0; width:100%; height:100%;
      background:#ffffff;
      z-index:10000;
      display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1.8rem;
      text-align:center;
      padding: 0 1.5rem;
    }
    /* Contenuto: fade-in 1.5s */
    @keyframes splashContentIn {
      0%   { opacity:0; transform:translateY(20px); }
      100% { opacity:1; transform:translateY(0); }
    }
    #loader-logo {
      animation: splashContentIn 1.5s cubic-bezier(0.25,0.46,0.45,0.94) 0s forwards;
      opacity:0;
    }
    #loader-name {
      animation: splashContentIn 1.5s cubic-bezier(0.25,0.46,0.45,0.94) 0.2s forwards;
      opacity:0;
    }
    #loader-line {
      animation: splashContentIn 1.5s cubic-bezier(0.25,0.46,0.45,0.94) 0.4s forwards;
      opacity:0;
    }
    #loader-sub {
      animation: splashContentIn 1.5s cubic-bezier(0.25,0.46,0.45,0.94) 0.55s forwards;
      opacity:0;
    }
    /* Uscita: sollevamento coperchio */
    @keyframes splashExit {
      0%   { opacity:1; transform:translateY(0px); }
      100% { opacity:0; transform:translateY(-50px); }
    }
    #loader.exit {
      animation: splashExit 1.5s cubic-bezier(0.4,0,0.2,1) forwards;
      pointer-events:none;
    }
    /* Barra dorata */
    .loader-bar { width:240px; height:1px; background:rgba(212,175,55,0.2); position:relative; overflow:hidden; }
    .loader-bar::after {
      content:''; position:absolute; inset:0;
      background:linear-gradient(90deg, transparent, #D4AF37, transparent);
      animation: loadSlide 1.4s ease infinite;
    }
    @keyframes loadSlide { 0%{transform:translateX(-100%)} 100%{transform:translateX(200%)} }

    /* — Nav — */
    .nav-glass {
      position:fixed; top:0; left:0; right:0; z-index:100;
      background:rgba(255,255,255,0.97);
      transition: border-color 0.4s, box-shadow 0.4s;
    }
    @media(min-width:768px){
      .nav-glass { backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px); background:rgba(255,255,255,0.94); }
    }
    .nav-glass.scrolled { border-bottom:1px solid rgba(212,175,55,0.22); box-shadow:0 2px 20px rgba(0,0,0,0.05); }

    .nav-link.active { color:#D4AF37; border-bottom-color:#D4AF37; }
    .nav-link:not(.active) { color:#1A1A1A; }

    .nav-link:focus-visible { outline:2px solid #D4AF37; outline-offset:4px; border-radius:2px; }

    .ham-line { display:block; width:22px; height:1px; background:#1A1A1A; transition:all 0.3s; }

    .mobile-link { display:block; font-family:'Lato'; font-size:0.82rem; letter-spacing:0.15em; text-transform:uppercase; background:none; border:none; cursor:pointer; padding:0.85rem 0; border-bottom:1px solid rgba(212,175,55,0.1); width:100%; text-align:left; transition:color 0.2s; -webkit-tap-highlight-color:transparent; }

    /* — Section common — */
    .section-pad { padding:clamp(4.5rem,10vw,9rem) clamp(1.25rem,5vw,2.5rem); contain:layout style; }

    .gold-bar-center { display:block; width:38px; height:1px; background:#D4AF37; margin:0 auto; }

    /* — Reveal animation — */
    .reveal { opacity:0; transform:translateY(28px); transition:opacity 0.75s cubic-bezier(0.25,0.46,0.45,0.94), transform 0.75s cubic-bezier(0.25,0.46,0.45,0.94); will-change:opacity,transform; }
    .reveal.visible { opacity:1; transform:translateY(0); will-change:auto; }
    .reveal.visible { opacity:1; transform:none; }
    .reveal-delay-1 { transition-delay:0.12s; }

    /* — Hero — */

    /* — Gallery Masonry — */
    .masonry { columns:2; column-gap:10px; min-height:10px; }
    @media(min-width:640px){ .masonry { columns:2; column-gap:14px; } }
    @media(min-width:1024px){ .masonry { columns:3; column-gap:16px; } }
    .mason-item { break-inside:avoid; margin-bottom:10px; cursor:pointer; overflow:hidden; position:relative; display:block; }
    @media(min-width:640px){ .mason-item { margin-bottom:14px; } }
    @media(min-width:1024px){ .mason-item { margin-bottom:16px; } }
    .mason-img { width:100%; display:block; transition:transform 0.6s cubic-bezier(0.25,0.46,0.45,0.94); object-fit:cover; will-change:transform; backface-visibility:hidden; }
    .mason-item:hover .mason-img { transform:scale(1.04); }
    .mason-overlay { position:absolute; inset:0; background:rgba(26,26,26,0); transition:background 0.4s; display:flex; align-items:flex-end; padding:1rem; }
    .mason-item:hover .mason-overlay { background:rgba(26,26,26,0.52); }
    .mason-label { font-family:'Playfair Display',serif; font-style:italic; color:#fff; font-size:0.82rem; letter-spacing:0.04em; opacity:0; transition:opacity 0.3s; }
    .mason-item:hover .mason-label { opacity:1; }

    /* — Lightbox — */
    .lb-overlay { position:fixed; inset:0; background:rgba(8,8,8,0.97); z-index:9999; display:flex; align-items:center; justify-content:center; overscroll-behavior:contain; touch-action:none; }
    .lb-img { max-width:min(92vw,860px); max-height:82dvh; object-fit:contain; display:block; animation:fadeInLb 0.25s ease; user-select:none; }
    @keyframes fadeInLb { from{opacity:0;transform:scale(0.97)} to{opacity:1;transform:scale(1)} }
    @keyframes lbFadeIn { from{opacity:0;transform:scale(0.97)} to{opacity:1;transform:scale(1)} }
    .lb-btn { background:rgba(15,15,15,0.75); border:1px solid rgba(212,175,55,0.25); color:rgba(255,255,255,0.6); cursor:pointer; display:flex; align-items:center; justify-content:center; transition:color 0.2s,border-color 0.2s; -webkit-tap-highlight-color:transparent; }
    .lb-btn:hover, .lb-btn:active { color:#D4AF37; border-color:rgba(212,175,55,0.6); }
    .lb-close { position:fixed; top:max(0.75rem,env(safe-area-inset-top,0.75rem)); right:0.75rem; z-index:10001; width:48px; height:48px; border-radius:2px; }

    .f-input { width:100%; padding:0.92rem 1rem; border:1px solid rgba(26,26,26,0.18); font-family:'Lato'; font-size:1rem; background:#FAFAF8; color:#1A1A1A; -webkit-appearance:none; appearance:none; transition:border-color 0.3s, box-shadow 0.3s; border-radius:0; }

    /* — Buttons — */
    .btn-primary { font-family:'Lato'; font-size:0.72rem; letter-spacing:0.2em; text-transform:uppercase; background:#1A1A1A; color:#D4AF37; border:none; padding:1rem 2rem; cursor:pointer; transition:all 0.3s; min-height:48px; -webkit-tap-highlight-color:transparent; display:inline-flex; align-items:center; justify-content:center; gap:8px; }

    .btn-secondary { font-family:'Lato'; font-size:0.72rem; letter-spacing:0.18em; text-transform:uppercase; background:transparent; color:#1A1A1A; border:1px solid rgba(26,26,26,0.28); padding:1rem 2rem; cursor:pointer; transition:all 0.3s; min-height:48px; -webkit-tap-highlight-color:transparent; display:inline-flex; align-items:center; justify-content:center; gap:8px; text-decoration:none; }

    .btn-wa:hover { background:#1ebe5d; }

    /* — Tipologia grid — */
    .tipo-btn { font-family:'Lato'; font-size:0.82rem; padding:0.88rem 0.5rem; border:1px solid rgba(26,26,26,0.15); background:transparent; color:#666; cursor:pointer; transition:all 0.22s; text-align:center; min-height:52px; -webkit-tap-highlight-color:transparent; line-height:1.3; }
    .tipo-btn.active { border-color:#D4AF37; background:rgba(212,175,55,0.07); color:#D4AF37; }

    /* — Step dots — */
    .step-dot { width:34px; height:34px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-family:'Lato'; font-size:0.68rem; font-weight:700; transition:all 0.35s; }

    .step-dot.active { background:#1A1A1A; border:1px solid #1A1A1A; color:#fff; }
    .step-dot.idle { background:transparent; border:1px solid rgba(26,26,26,0.2); color:rgba(26,26,26,0.35); }

    /* — Float WA — */
    .float-wa { position:fixed; bottom:1.5rem; right:1.5rem; z-index:500; width:56px; height:56px; border-radius:50%; background:#25D366; border:none; cursor:pointer; display:flex; align-items:center; justify-content:center; box-shadow:0 4px 20px rgba(37,211,102,0.4); -webkit-tap-highlight-color:transparent; transform:translateZ(0); backface-visibility:hidden; will-change:auto; transition:box-shadow 0.3s; }

    /* — Toast — */
    .toast { position:fixed; bottom:5.5rem; right:1.25rem; z-index:5000; background:#111; color:#D4AF37; padding:0.85rem 1.3rem; border:1px solid rgba(212,175,55,0.45); font-family:'Lato'; font-size:0.8rem; letter-spacing:0.08em; animation:slideInRight 0.35s ease; max-width:calc(100vw - 2.5rem); }

    @keyframes slideInRight { from{opacity:0;transform:translateX(18px)} to{opacity:1;transform:translateX(0)} }

    /* — Testimonials carousel — */
    .testimonial-bg { background:linear-gradient(135deg, #1A1A1A 0%, #2a2018 100%); }

    @keyframes slideUp { from{transform:translateY(100%)} to{transform:translateY(0)} }
    .cookie-text { font-family:'Lato'; font-size:0.78rem; color:rgba(255,255,255,0.65); line-height:1.75; flex:1 1 280px; letter-spacing:0.02em; }
    .cookie-text a { color:#D4AF37; text-decoration:underline; }
    .cookie-btns { display:flex; gap:0.6rem; flex-wrap:wrap; flex-shrink:0; }
    .cookie-accept { font-family:'Lato'; font-size:0.68rem; letter-spacing:0.16em; text-transform:uppercase; background:#D4AF37; color:#1A1A1A; border:none; padding:0.7rem 1.4rem; cursor:pointer; min-height:40px; font-weight:700; transition:background 0.2s; }
    .cookie-accept:hover { background:#c9a52e; }
    .cookie-reject { font-family:'Lato'; font-size:0.68rem; letter-spacing:0.16em; text-transform:uppercase; background:transparent; color:rgba(255,255,255,0.35); border:1px solid rgba(255,255,255,0.12); padding:0.7rem 1.2rem; cursor:pointer; min-height:40px; transition:all 0.2s; }
    .cookie-reject:hover { color:rgba(255,255,255,0.7); border-color:rgba(255,255,255,0.3); }

    /* — Privacy Modal — */
    .privacy-overlay { position:fixed; inset:0; background:rgba(8,8,8,0.96); z-index:9000; display:flex; align-items:center; justify-content:center; padding:1rem; animation:fadeIn 0.3s ease; }
    @keyframes fadeIn { from{opacity:0} to{opacity:1} }
    .privacy-card { background:#111; border:1px solid rgba(212,175,55,0.25); width:100%; max-width:720px; max-height:88vh; display:flex; flex-direction:column; animation:scaleIn 0.3s ease; }
    .privacy-head { padding:1.5rem 2rem; border-bottom:1px solid rgba(212,175,55,0.12); display:flex; align-items:center; justify-content:space-between; flex-shrink:0; }
    .privacy-body { overflow-y:auto; padding:1.5rem 2rem 2rem; -webkit-overflow-scrolling:touch; flex:1; }
    .privacy-body h3 { font-family:'Playfair Display',serif; font-style:italic; font-size:1rem; color:#D4AF37; margin:1.4rem 0 0.5rem; font-weight:400; }
    .privacy-body h3:first-child { margin-top:0; }
    .privacy-body p { font-family:'Lato'; font-size:0.82rem; color:#888; line-height:1.9; margin-bottom:0.6rem; }
    .privacy-body strong { color:#bbb; }

    /* — Google Reviews button — */
    .btn-reviews { font-family:'Lato'; font-size:0.7rem; letter-spacing:0.15em; text-transform:uppercase; background:transparent; color:#4285F4; border:1px solid rgba(66,133,244,0.35); padding:0.85rem 1.4rem; cursor:pointer; min-height:44px; display:inline-flex; align-items:center; justify-content:center; gap:8px; transition:all 0.25s; text-decoration:none; }
    .btn-reviews:hover { background:rgba(66,133,244,0.08); border-color:#4285F4; }

    /* — Calendar admin — */
    .cal-day { aspect-ratio:1; display:flex; align-items:center; justify-content:center; font-size:0.76rem; cursor:pointer; border-radius:3px; transition:all 0.18s; font-family:'Lato'; color:#bbb; min-height:34px; -webkit-tap-highlight-color:transparent; }
    .cal-day:hover:not(.cal-blocked):not(.cal-past) { background:rgba(212,175,55,0.18); color:#D4AF37; }
    .cal-day.cal-blocked { background:rgba(120,120,120,0.25); color:#888; font-weight:700; border:1px solid rgba(150,150,150,0.4); cursor:pointer; }
    .cal-day.cal-blocked::after { content:' ✕'; font-size:0.55rem; }
    .cal-day.cal-today { border:1px solid #D4AF37; color:#D4AF37; }
    .cal-day.cal-past { opacity:0.22; cursor:default; pointer-events:none; }

    /* — Admin overlay — */
    .admin-wrap { position:fixed; inset:0; background:rgba(8,8,8,0.99); z-index:2000; overflow-y:auto; -webkit-overflow-scrolling:touch; }
    .admin-inner { max-width:860px; margin:0 auto; padding:1.5rem 1.25rem 4rem; }
    @media(min-width:640px){ .admin-inner { padding:2.5rem 2rem 4rem; } }

    /* — Login — */
    .login-wrap { position:fixed; inset:0; background:rgba(8,8,8,0.99); z-index:2000; display:flex; align-items:center; justify-content:center; padding:1rem; }
    .login-card { background:#111; border:1px solid rgba(212,175,55,0.28); padding:2.5rem 2rem; width:100%; max-width:400px; animation:scaleIn 0.3s ease; }
    @keyframes scaleIn { from{opacity:0;transform:scale(0.96)} to{opacity:1;transform:scale(1)} }

    /* — Recap row — */
    .recap-row { display:flex; justify-content:space-between; align-items:center; padding:0.48rem 0; border-bottom:1px solid rgba(212,175,55,0.1); font-family:'Lato'; font-size:0.82rem; }
    .recap-key { color:#aaa; } .recap-val { color:#1A1A1A; font-weight:700; }
    /* — Petali cadenti — */
    .petal { position:absolute; pointer-events:none; opacity:0; animation: petalFall linear infinite; backface-visibility:hidden; contain:strict; }
    /* Disabilita petali su mobile per performance */
    @media(max-width:767px){ .petal { display:none !important; } }
    @media(prefers-reduced-motion:reduce){ .petal { display:none !important; } }
    @keyframes petalFall {
      0%   { opacity:0; transform: translateY(-20px) rotate(0deg) scale(0.8); }
      10%  { opacity:0.7; }
      90%  { opacity:0.4; }
      100% { opacity:0; transform: translateY(100vh) rotate(720deg) scale(1.1) translateX(60px); }
    }

    /* — Come funziona — */
    .step-card { background:#FFF; border:1px solid rgba(212,175,55,0.18); padding:clamp(1.5rem,4vw,2.2rem); position:relative; transition:border-color 0.3s, box-shadow 0.3s; }
    .step-card:hover { border-color:rgba(212,175,55,0.5); box-shadow:0 8px 32px rgba(0,0,0,0.06); }
    .step-num { font-family:'Playfair Display',serif; font-size:clamp(2.5rem,6vw,4rem); font-weight:400; color:rgba(212,175,55,0.15); line-height:1; position:absolute; top:1rem; right:1.2rem; }

    /* — Prezzi — */
    .price-card { border:1px solid rgba(212,175,55,0.2); padding:clamp(1.5rem,4vw,2.5rem); background:#FFF; transition:all 0.3s; position:relative; overflow:hidden; }
    .price-card::before { content:''; position:absolute; top:0; left:0; right:0; height:2px; background:linear-gradient(90deg, transparent, #D4AF37, transparent); opacity:0; transition:opacity 0.3s; }
    .price-card:hover { border-color:rgba(212,175,55,0.5); box-shadow:0 12px 40px rgba(0,0,0,0.07); }
    .price-card:hover::before { opacity:1; }
    .price-card.featured { border-color:#D4AF37; }
    .price-card.featured::before { opacity:1; }
    .price-tag { font-family:'Playfair Display',serif; font-size:clamp(1.6rem,4vw,2.2rem); font-weight:400; color:#D4AF37; line-height:1; }
    .price-from { font-family:'Lato'; font-size:0.62rem; letter-spacing:0.18em; text-transform:uppercase; color:#aaa; display:block; margin-bottom:0.3rem; }

  </style>

function CookieBanner({ onPrivacy }) {
  const [show, setShow] = useState(false);
  useEffect(() => {
    if(!localStorage.getItem('cookie_ok')) setShow(true);
  }, []);
  const accept = () => {
    localStorage.setItem('cookie_ok', '1');
    setShow(false);
  };
  if(!show) return null;
  return (
    <div class="fixed bottom-0 left-0 right-0 bg-neutral-950 text-white text-[11px] p-4 z-50 border-t border-gold/20 flex flex-col sm:flex-row justify-between items-center gap-3 font-sans tracking-wider">
      <p class="text-neutral-400 text-center sm:text-left">Questo sito utilizza cookie tecnici per garantire la corretta visualizzazione delle creazioni dell'Atelier. <button onClick={onPrivacy} class="text-gold underline ml-1">Privacy Policy</button></p>
      <button onClick={accept} class="bg-gold text-neutral-900 uppercase font-bold py-1.5 px-6 text-[10px]">Accetto</button>
    </div>
  );
}

// --- MAIN APP ---
function App() {
  const [nav, setNav] = useState('Atelier');
  const [showPrivacy, setShowPrivacy] = useState(false);
  const [admin, setAdmin] = useState(null);
  const [blocked, setBlocked] = useState(false);

  useEffect(() => {
    const onScroll = () => {
      const sections = [
        { id: 'atelier', label: 'Atelier' },
        { id: 'galleria', label: 'Galleria' },
        { id: 'stampe', label: 'Stampe Alcoliche/Alimentari' },
        { id: 'preventivo', label: 'Preventivo' },
        { id: 'contatti', label: 'Contatti' }
      ];
      let current = sections[0];
      const scrollY = window.scrollY + 200;
      for (const s of sections) {
        const el = document.getElementById(s.id);
        if (el && el.offsetTop <= scrollY) current = s;
      }
      setNav(current.label);
    };
    window.addEventListener('scroll', onScroll, { passive: true });
    onScroll();
    return () => window.removeEventListener('scroll', onScroll);
  }, []);

  const scrollTo = id => setTimeout(() => document.getElementById(id)?.scrollIntoView({behavior:'smooth'}), 50);

  return (
    <>
      <Nav active={nav} setActive={setNav}/>
      <Hero onCTA={() => scrollTo('preventivo')}/>
      <Numbers/>
      <Atelier/>
      <Gallery/>
      <VideoSection/>
      <Testimonial/>
      <StampeAlimentari/>
      <ComeFunziona/>
      <FAQ/>
      <Preventivo blocked={blocked}/>
      <Contatti/>
      <Footer onAdmin={() => setAdmin('login')} onPrivacy={() => setShowPrivacy(true)}/>
      <FloatWA/>
      <CookieBanner onPrivacy={() => setShowPrivacy(true)}/>
      {showPrivacy && <PrivacyModal onClose={() => setShowPrivacy(false)}/>}
      {admin === 'login' && <AdminLogin onOk={() => setAdmin('dash')} onClose={() => setAdmin(null)}/>}
      {admin === 'dash' && <AdminDash onClose={() => setAdmin(null)} blocked={blocked} setBlocked={setBlocked}/>}
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>

  if (window.netlifyIdentity) {
    window.netlifyIdentity.on("init", function(user) {
      if (!user) {
        window.netlifyIdentity.on("login", function() {
          document.location.href = "/admin/";
        });
      }
    });
  }
</script>
</body>
