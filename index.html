  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
    body { font-family:'Lato',sans-serif; background:#FFF; color:#1A1A1A; overflow-x:hidden; touch-action:pan-y; overscroll-behavior-y:none; -webkit-overflow-scrolling:touch; }

    /* — Skip link (accessibilità) — */
    .skip-link { position:absolute; left:-9999px; top:0; background:#D4AF37; color:#1A1A1A; padding:0.5rem 1rem; font-family:'Lato'; font-size:0.8rem; z-index:99999; }
    .skip-link:focus { left:0; }

    /* — Scrollbar — */
    .scroll-hint { display: flex; }
    @media (max-height: 700px), (max-width: 480px) { .scroll-hint { display: none !important; } }
    ::-webkit-scrollbar { width:5px; }
    ::-webkit-scrollbar-track { background:transparent; }
    ::-webkit-scrollbar-thumb { background:#D4AF37; border-radius:2px; }

    /* ══ SPLASH SCREEN ══ */
    #loader {
      position:fixed; top:0; left:0; width:100%; height:100%;
      background:#ffffff;
      z-index:10000;
      display:flex; flex-direction:column; align-items:center; justify-content:center; gap:0;
      text-align:center;
      overflow:hidden;
    }

    /* Logo: entra grande da lontano, si stabilizza, poi scompare */
    @keyframes logoZoomIn {
      0%   { opacity:0; transform:scale(3.5); }
      30%  { opacity:1; transform:scale(1); }
      70%  { opacity:1; transform:scale(1); }
      100% { opacity:0; transform:scale(0.4); }
    }
    #loader-logo {
      animation: logoZoomIn 3.5s cubic-bezier(0.16,1,0.3,1) 0.1s forwards;
      opacity:0;
      width: min(90vw, 680px);
      height: min(90vw, 680px);
      object-fit: contain;
      border-radius: 20px;
    }

    /* Sottotitolo: appare sotto il logo */
    @keyframes subFadeIn {
      0%   { opacity:0; transform:translateY(12px); }
      40%  { opacity:1; transform:translateY(0); }
      75%  { opacity:1; }
      100% { opacity:0; }
    }
    #loader-sub {
      animation: subFadeIn 3s cubic-bezier(0.25,0.46,0.45,0.94) 0.5s forwards;
      opacity:0;
      margin-top:1.2rem;
    }

    /* Nascosti — non servono più */
    #loader-name, #loader-line { display:none; }

    /* Uscita finale: fade out dell'intero splash */
    @keyframes splashExit {
      0%   { opacity:1; }
      100% { opacity:0; }
    }
    #loader.exit {
      animation: splashExit 0.8s ease forwards;
      pointer-events:none;
    }

    /* Barra dorata (mantenuta per compatibilità) */
    .loader-bar { display:none; }
    @keyframes loadSlide { 0%{transform:translateX(-100%)} 100%{transform:translateX(200%)} }

    /* — Nav — */
    .nav-glass {
      position:fixed; top:0; left:0; right:0; z-index:100;
      background:rgba(255,255,255,0.97);
      transition: border-color 0.4s, box-shadow 0.4s;
    }
    @media(min-width:768px){
      .nav-glass { backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px); background:rgba(255,255,255,0.94); }
    }
    .nav-glass.scrolled { border-bottom:1px solid rgba(212,175,55,0.22); box-shadow:0 2px 20px rgba(0,0,0,0.05); }
    .nav-inner { max-width:1200px; margin:0 auto; padding:0 1.25rem; display:flex; align-items:center; justify-content:space-between; height:60px; }
    @media(min-width:768px){ .nav-inner { padding:0 2.5rem; height:68px; } }
    .nav-logo { font-family:'Playfair Display',serif; font-size:1.05rem; font-weight:600; letter-spacing:0.22em; color:#1A1A1A; background:none; border:none; cursor:pointer; -webkit-tap-highlight-color:transparent; }
    .nav-links { display:none; gap:2rem; }
    @media(min-width:768px){ .nav-links { display:flex; } }
    .nav-link { font-family:'Lato'; font-size:0.7rem; letter-spacing:0.18em; text-transform:uppercase; background:none; border:none; cursor:pointer; padding-bottom:2px; border-bottom:1px solid transparent; transition:all 0.3s; -webkit-tap-highlight-color:transparent; }
    .nav-link.active { color:#D4AF37; border-bottom-color:#D4AF37; }
    .nav-link:not(.active) { color:#1A1A1A; }
    .nav-link:hover { color:#D4AF37; }
    .nav-link:focus-visible { outline:2px solid #D4AF37; outline-offset:4px; border-radius:2px; }
    .hamburger { display:flex; flex-direction:column; gap:5px; background:none; border:none; cursor:pointer; padding:8px; -webkit-tap-highlight-color:transparent; }
    @media(min-width:768px){ .hamburger { display:none; } }
    .ham-line { display:block; width:22px; height:1px; background:#1A1A1A; transition:all 0.3s; }
    .mobile-menu { display:none; background:rgba(255,255,255,0.98); border-top:1px solid rgba(212,175,55,0.15); padding:0.5rem 1.25rem 1.5rem; }
    .mobile-menu.open { display:block; }
    .mobile-link { display:block; font-family:'Lato'; font-size:0.82rem; letter-spacing:0.15em; text-transform:uppercase; background:none; border:none; cursor:pointer; padding:0.85rem 0; border-bottom:1px solid rgba(212,175,55,0.1); width:100%; text-align:left; transition:color 0.2s; -webkit-tap-highlight-color:transparent; }

    /* — Section common — */
    .section-pad { padding:clamp(4.5rem,10vw,9rem) clamp(1.25rem,5vw,2.5rem); contain:layout style; }
    .section-label { font-family:'Lato'; font-size:0.66rem; letter-spacing:0.44em; text-transform:uppercase; color:#D4AF37; margin-bottom:1.1rem; }
    .section-title { font-family:'Playfair Display',serif; font-size:clamp(1.9rem,4.5vw,3rem); font-weight:400; line-height:1.15; color:#1A1A1A; margin-bottom:1.4rem; }
    .gold-bar { display:block; width:38px; height:1px; background:#D4AF37; }
    .gold-bar-center { display:block; width:38px; height:1px; background:#D4AF37; margin:0 auto; }

    /* — Reveal animation — */
    .reveal { opacity:0; transform:translateY(28px); transition:opacity 0.75s cubic-bezier(0.25,0.46,0.45,0.94), transform 0.75s cubic-bezier(0.25,0.46,0.45,0.94); will-change:opacity,transform; }
    .reveal.visible { opacity:1; transform:translateY(0); will-change:auto; }
    .reveal.visible { opacity:1; transform:none; }
    .reveal-delay-1 { transition-delay:0.12s; }
    .reveal-delay-2 { transition-delay:0.24s; }
    .reveal-delay-3 { transition-delay:0.36s; }
    .reveal-delay-4 { transition-delay:0.48s; }

    /* — Hero — */
    .hero-title { font-family:'Playfair Display',serif; font-size:clamp(3.8rem,14vw,9.5rem); font-weight:400; letter-spacing:0.03em; line-height:0.9; color:#1A1A1A; }
    @keyframes heroUp { from{opacity:0;transform:translateY(36px)} to{opacity:1;transform:translateY(0)} }
    .hero-anim { opacity:0; animation:heroUp 1s cubic-bezier(0.25,0.46,0.45,0.94) forwards; }
    .ha0{animation-delay:0.1s} .ha1{animation-delay:0.28s} .ha2{animation-delay:0.46s} .ha3{animation-delay:0.64s} .ha4{animation-delay:0.82s}

    /* — Numbers — */
    .stat-num { font-family:'Playfair Display',serif; font-size:clamp(2.2rem,5vw,3.5rem); font-weight:400; color:#D4AF37; line-height:1; }

    /* — Gallery Masonry — */
    .masonry { columns:2; column-gap:10px; min-height:10px; }
    @media(min-width:640px){ .masonry { columns:2; column-gap:14px; } }
    @media(min-width:1024px){ .masonry { columns:3; column-gap:16px; } }
    .mason-item { break-inside:avoid; margin-bottom:10px; cursor:pointer; overflow:hidden; position:relative; display:block; }
    @media(min-width:640px){ .mason-item { margin-bottom:14px; } }
    @media(min-width:1024px){ .mason-item { margin-bottom:16px; } }
    .mason-img { width:100%; display:block; transition:transform 0.6s cubic-bezier(0.25,0.46,0.45,0.94); object-fit:cover; will-change:transform; backface-visibility:hidden; }
    .mason-item:hover .mason-img { transform:scale(1.04); }
    .mason-overlay { position:absolute; inset:0; background:rgba(26,26,26,0); transition:background 0.4s; display:flex; align-items:flex-end; padding:1rem; }
    .mason-item:hover .mason-overlay { background:rgba(26,26,26,0.52); }
    .mason-label { font-family:'Playfair Display',serif; font-style:italic; color:#fff; font-size:0.82rem; letter-spacing:0.04em; opacity:0; transition:opacity 0.3s; }
    .mason-item:hover .mason-label { opacity:1; }

    /* — Lightbox — */
    .lb-overlay { position:fixed; inset:0; background:rgba(8,8,8,0.97); z-index:9999; display:flex; align-items:center; justify-content:center; overscroll-behavior:contain; touch-action:none; }
    .lb-img { max-width:min(92vw,860px); max-height:82dvh; object-fit:contain; display:block; animation:fadeInLb 0.25s ease; user-select:none; }
    @keyframes fadeInLb { from{opacity:0;transform:scale(0.97)} to{opacity:1;transform:scale(1)} }
    @keyframes lbFadeIn { from{opacity:0;transform:scale(0.97)} to{opacity:1;transform:scale(1)} }
    .lb-btn { background:rgba(15,15,15,0.75); border:1px solid rgba(212,175,55,0.25); color:rgba(255,255,255,0.6); cursor:pointer; display:flex; align-items:center; justify-content:center; transition:color 0.2s,border-color 0.2s; -webkit-tap-highlight-color:transparent; }
    .lb-btn:hover, .lb-btn:active { color:#D4AF37; border-color:rgba(212,175,55,0.6); }
    .lb-close { position:fixed; top:max(0.75rem,env(safe-area-inset-top,0.75rem)); right:0.75rem; z-index:10001; width:48px; height:48px; border-radius:2px; }
    .lb-prev-btn { position:fixed; left:0.5rem; top:50%; transform:translateY(-50%); z-index:10001; width:48px; height:48px; }
    .lb-next-btn { position:fixed; right:0.5rem; top:50%; transform:translateY(-50%); z-index:10001; width:48px; height:48px; }
    @media(min-width:640px){ .lb-prev-btn{left:1.5rem} .lb-next-btn{right:1.5rem} }

    /* — Form inputs — */
    .f-input { width:100%; padding:0.92rem 1rem; border:1px solid rgba(26,26,26,0.18); font-family:'Lato'; font-size:1rem; background:#FAFAF8; color:#1A1A1A; -webkit-appearance:none; appearance:none; transition:border-color 0.3s, box-shadow 0.3s; border-radius:0; }
    .f-input:focus { outline:none; border-color:#D4AF37; box-shadow:0 0 0 3px rgba(212,175,55,0.12); }
    .f-label { font-family:'Lato'; font-size:0.68rem; letter-spacing:0.22em; text-transform:uppercase; color:#777; display:block; margin-bottom:0.55rem; }

    /* — Buttons — */
    .btn-primary { font-family:'Lato'; font-size:0.72rem; letter-spacing:0.2em; text-transform:uppercase; background:#1A1A1A; color:#D4AF37; border:none; padding:1rem 2rem; cursor:pointer; transition:all 0.3s; min-height:48px; -webkit-tap-highlight-color:transparent; display:inline-flex; align-items:center; justify-content:center; gap:8px; }
    .btn-primary:hover { background:#D4AF37; color:#1A1A1A; }
    .btn-primary:focus-visible { outline:2px solid #D4AF37; outline-offset:3px; }
    .btn-secondary { font-family:'Lato'; font-size:0.72rem; letter-spacing:0.18em; text-transform:uppercase; background:transparent; color:#1A1A1A; border:1px solid rgba(26,26,26,0.28); padding:1rem 2rem; cursor:pointer; transition:all 0.3s; min-height:48px; -webkit-tap-highlight-color:transparent; display:inline-flex; align-items:center; justify-content:center; gap:8px; text-decoration:none; }
    .btn-secondary:hover { border-color:#D4AF37; color:#D4AF37; }
    .btn-ghost { font-family:'Lato'; font-size:0.7rem; letter-spacing:0.15em; text-transform:uppercase; background:transparent; color:#888; border:1px solid rgba(26,26,26,0.15); padding:0.85rem 1.2rem; cursor:pointer; transition:all 0.2s; min-height:44px; -webkit-tap-highlight-color:transparent; }
    .btn-ghost:hover { color:#1A1A1A; border-color:rgba(26,26,26,0.4); }
    .btn-wa { font-family:'Lato'; font-size:0.72rem; letter-spacing:0.15em; text-transform:uppercase; background:#25D366; color:#fff; border:none; padding:1rem 1.5rem; cursor:pointer; transition:background 0.3s; min-height:48px; -webkit-tap-highlight-color:transparent; display:inline-flex; align-items:center; justify-content:center; gap:8px; }
    .btn-wa:hover { background:#1ebe5d; }

    /* — Tipologia grid — */
    .tipo-btn { font-family:'Lato'; font-size:0.82rem; padding:0.88rem 0.5rem; border:1px solid rgba(26,26,26,0.15); background:transparent; color:#666; cursor:pointer; transition:all 0.22s; text-align:center; min-height:52px; -webkit-tap-highlight-color:transparent; line-height:1.3; }
    .tipo-btn.active { border-color:#D4AF37; background:rgba(212,175,55,0.07); color:#D4AF37; }

    /* — Step dots — */
    .step-dot { width:34px; height:34px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-family:'Lato'; font-size:0.68rem; font-weight:700; transition:all 0.35s; }
    .step-dot.done { background:#D4AF37; border:1px solid #D4AF37; color:#1A1A1A; cursor:pointer; }
    .step-dot.active { background:#1A1A1A; border:1px solid #1A1A1A; color:#fff; }
    .step-dot.idle { background:transparent; border:1px solid rgba(26,26,26,0.2); color:rgba(26,26,26,0.35); }

    /* — Float WA — */
    .float-wa { position:fixed; bottom:1.5rem; right:1.5rem; z-index:500; width:56px; height:56px; border-radius:50%; background:#25D366; border:none; cursor:pointer; display:flex; align-items:center; justify-content:center; box-shadow:0 4px 20px rgba(37,211,102,0.4); -webkit-tap-highlight-color:transparent; transform:translateZ(0); backface-visibility:hidden; will-change:auto; transition:box-shadow 0.3s; }
    .float-wa:hover { box-shadow:0 6px 28px rgba(37,211,102,0.55); }
    .float-wa:active { opacity:0.9; }
    @media(min-width:768px){ .float-wa { width:60px; height:60px; bottom:2rem; right:2rem; } }

    /* — Toast — */
    .toast { position:fixed; bottom:5.5rem; right:1.25rem; z-index:5000; background:#111; color:#D4AF37; padding:0.85rem 1.3rem; border:1px solid rgba(212,175,55,0.45); font-family:'Lato'; font-size:0.8rem; letter-spacing:0.08em; animation:slideInRight 0.35s ease; max-width:calc(100vw - 2.5rem); }
    @media(min-width:768px){ .toast { right:2rem; bottom:2rem; max-width:360px; } }
    @keyframes slideInRight { from{opacity:0;transform:translateX(18px)} to{opacity:1;transform:translateX(0)} }

    /* — Testimonials carousel — */
    .testimonial-bg { background:linear-gradient(135deg, #1A1A1A 0%, #2a2018 100%); }
    .testi-dots { display:flex; gap:0; justify-content:center; margin-top:2rem; }
    .testi-dot { width:24px; height:24px; min-width:24px; background:transparent; border:none; cursor:pointer; padding:0; position:relative; }
    .testi-dot::before { content:''; position:absolute; top:50%; left:50%; width:6px; height:6px; margin:-3px 0 0 -3px; border-radius:50%; background:rgba(255,255,255,0.2); transition:all 0.3s; }
    .testi-dot.active::before { background:#D4AF37; width:20px; margin-left:-10px; border-radius:3px; }
    @keyframes fadeSlide { from{opacity:0;transform:translateY(12px)} to{opacity:1;transform:translateY(0)} }
    .testi-anim { animation:fadeSlide 0.5s ease; }

    /* — FAQ accordion — */
    .faq-item { border-bottom:1px solid rgba(212,175,55,0.15); }
    .faq-trigger { width:100%; display:flex; align-items:center; justify-content:space-between; padding:1.4rem 0; background:none; border:none; cursor:pointer; text-align:left; gap:1rem; -webkit-tap-highlight-color:transparent; }
    .faq-q { font-family:'Playfair Display',serif; font-size:clamp(0.95rem,2vw,1.08rem); font-weight:400; color:#1A1A1A; line-height:1.4; }
    .faq-icon { flex-shrink:0; width:24px; height:24px; border:1px solid rgba(212,175,55,0.4); display:flex; align-items:center; justify-content:center; transition:transform 0.35s, background 0.25s; border-radius:0; }
    .faq-item.open .faq-icon { background:#D4AF37; transform:rotate(45deg); }
    .faq-body { overflow:hidden; max-height:0; transition:max-height 0.45s cubic-bezier(0.25,0.46,0.45,0.94), padding 0.35s; padding:0; }
    .faq-item.open .faq-body { max-height:300px; padding-bottom:1.4rem; }
    .faq-a { font-family:'Lato'; font-size:0.88rem; color:#666; line-height:2; letter-spacing:0.02em; }

    /* — Contact section — */
    .contact-card { border:1px solid rgba(212,175,55,0.2); padding:clamp(1.5rem,4vw,2.5rem); background:#FFF; transition:border-color 0.3s, box-shadow 0.3s; }
    .contact-card:hover { border-color:rgba(212,175,55,0.5); box-shadow:0 8px 32px rgba(0,0,0,0.06); }
    .contact-icon { width:48px; height:48px; border:1px solid rgba(212,175,55,0.35); display:flex; align-items:center; justify-content:center; color:#D4AF37; flex-shrink:0; }

    /* — Cookie banner — */
    .cookie-banner { position:fixed; bottom:0; left:0; right:0; z-index:8000; background:#111; border-top:1px solid rgba(212,175,55,0.25); padding:clamp(1rem,3vw,1.5rem) clamp(1.25rem,5vw,2.5rem); display:flex; flex-wrap:wrap; gap:1rem; align-items:center; justify-content:space-between; animation:slideUp 0.5s ease; }
    @keyframes slideUp { from{transform:translateY(100%)} to{transform:translateY(0)} }
    .cookie-text { font-family:'Lato'; font-size:0.78rem; color:rgba(255,255,255,0.65); line-height:1.75; flex:1 1 280px; letter-spacing:0.02em; }
    .cookie-text a { color:#D4AF37; text-decoration:underline; }
    .cookie-btns { display:flex; gap:0.6rem; flex-wrap:wrap; flex-shrink:0; }
    .cookie-accept { font-family:'Lato'; font-size:0.68rem; letter-spacing:0.16em; text-transform:uppercase; background:#D4AF37; color:#1A1A1A; border:none; padding:0.7rem 1.4rem; cursor:pointer; min-height:40px; font-weight:700; transition:background 0.2s; }
    .cookie-accept:hover { background:#c9a52e; }
    .cookie-reject { font-family:'Lato'; font-size:0.68rem; letter-spacing:0.16em; text-transform:uppercase; background:transparent; color:rgba(255,255,255,0.65); border:1px solid rgba(255,255,255,0.12); padding:0.7rem 1.2rem; cursor:pointer; min-height:40px; transition:all 0.2s; }
    .cookie-reject:hover { color:rgba(255,255,255,0.7); border-color:rgba(255,255,255,0.3); }

    /* — Privacy Modal — */
    .privacy-overlay { position:fixed; inset:0; background:rgba(8,8,8,0.96); z-index:9000; display:flex; align-items:center; justify-content:center; padding:1rem; animation:fadeIn 0.3s ease; }
    @keyframes fadeIn { from{opacity:0} to{opacity:1} }
    .privacy-card { background:#111; border:1px solid rgba(212,175,55,0.25); width:100%; max-width:720px; max-height:88vh; display:flex; flex-direction:column; animation:scaleIn 0.3s ease; }
    .privacy-head { padding:1.5rem 2rem; border-bottom:1px solid rgba(212,175,55,0.12); display:flex; align-items:center; justify-content:space-between; flex-shrink:0; }
    .privacy-body { overflow-y:auto; padding:1.5rem 2rem 2rem; -webkit-overflow-scrolling:touch; flex:1; }
    .privacy-body h3 { font-family:'Playfair Display',serif; font-style:italic; font-size:1rem; color:#D4AF37; margin:1.4rem 0 0.5rem; font-weight:400; }
