<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mavilo Dolce - Laboratorio di Pasticceria Artigianale</title>

  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

  <!-- React e Babel via CDN -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">

  <style type="text/css">
    :root {
      --color-gold: #C5A059;
      --color-gold-dark: #A3803B;
      --color-anthracite: #2C2C2C;
      --color-warm: #FAF8F5;
      --font-serif: 'Playfair Display', Georgia, serif;
      --font-sans: 'Montserrat', Helvetica, Arial, sans-serif;
      --font-display: 'Cinzel', serif;
    }

    .font-serif { font-family: var(--font-serif); }
    .font-sans { font-family: var(--font-sans); }
    .font-display { font-family: var(--font-display); }
    .text-gold { color: var(--color-gold); }
    .text-anthracite { color: var(--color-anthracite); }
    .bg-warm { background-color: var(--color-warm); }

    .btn-gold {
      background-color: var(--color-gold);
      color: #FFFFFF;
      font-family: var(--font-sans);
      font-weight: 500;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 0.75rem 2rem;
      border-radius: 0.25rem;
      transition: all 0.3s ease;
    }
    .btn-gold:hover {
      background-color: var(--color-gold-dark);
      transform: translateY(-1px);
    }

    .section-pad {
      padding: 5rem 1.5rem;
    }
    @media (min-width: 768px) {
      .section-pad { padding: 7rem 4rem; }
    }

    .section-title {
      font-family: var(--font-display);
      color: var(--color-anthracite);
      font-size: 1.75rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-align: center;
      margin-bottom: 2.5rem;
      text-transform: uppercase;
    }
    @media (min-width: 768px) {
      .section-title { font-size: 2.25rem; }
    }

    .section-label {
      font-family: var(--font-sans);
      color: var(--color-gold);
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      margin-bottom: 0.75rem;
      display: block;
      text-align: center;
    }

    .stat-num {
      font-family: var(--font-display);
      color: var(--color-gold);
      font-size: 3rem;
      font-weight: 400;
      line-height: 1;
    }

    /* Loader / Splash Screen original */
    #loader {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: var(--color-warm);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      opacity: 1;
      visibility: visible;
      transition: opacity 800ms cubic-bezier(0.4, 0, 0.2, 1), visibility 800ms;
    }
    #loader.exit {
      opacity: 0;
      visibility: hidden;
    }
    #loader-logo {
      width: 120px;
      height: auto;
      margin-bottom: 1.5rem;
      animation: pulse 2s infinite ease-in-out;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 0.9; }
      50% { transform: scale(1.03); opacity: 1; }
    }
  </style>
</head>
<body class="bg-warm text-anthracite font-sans antialiased m-0 p-0">

  <!-- Il nodo root originale dove React monta l'app -->
  <div id="root"></div>

  <!-- Logica React riparata senza alterare la tua struttura -->
  <script type="text/babel">
    const { useState, useEffect } = React;

    function App() {
      // Mantenuti i tuoi stati originali per la gestione del loader
      const [isLoaderVisible, setIsLoaderVisible] = useState(true);
      const [isLoaderExiting, setIsLoaderExiting] = useState(false);
      
      // Stato del contatore (impostato a 10)
      const [count, setCount] = useState(10);

      useEffect(() => {
        // Gestione temporizzata dello Splash Screen (3.5s + fadeout)
        const exitTimeout = setTimeout(() => {
          setIsLoaderExiting(true);
        }, 3500);

        const removeTimeout = setTimeout(() => {
          setIsLoaderVisible(false);
        }, 4300);

        // RIPARAZIONE ERRORE: Logica del contatore con funzione di pulizia
        const counterInterval = setInterval(() => {
          setCount((prevCount) => {
            if (prevCount <= 1) {
              return 10; // Reset a 10 quando arriva a zero
            }
            return prevCount - 1;
          });
        }, 1000);

        // Il "Clean-up" che mancava: distrugge i vecchi timer ed evita il doppio conteggio
        return () => {
          clearTimeout(exitTimeout);
          clearTimeout(removeTimeout);
          clearInterval(counterInterval);
        };
      }, []); // Esegue solo una volta al caricamento

      return (
        <div id="main-content">
          
          {/* Tuo Loader Originale */}
          {isLoaderVisible && (
            <div id="loader" className={isLoaderExiting ? 'exit' : ''} role="status" aria-label="Caricamento">
              <img id="loader-logo" src="data:image/png;base64,..." alt="Logo" />
              <div id="loader-sub" className="text-anthracite font-serif italic text-lg">
                Caricamento in corso...
              </div>
            </div>
          )}

          {/* Tua Struttura di Layout Originale */}
          <header class="w-full py-6 px-8 border-b border-gray-200/50 flex justify-between items-center bg-white/80 backdrop-blur-md sticky top-0 z-50">
            <div class="font-display font-bold text-xl tracking-wider text-anthracite">MAVILO DOLCE</div>
            <nav class="hidden md:flex space-x-8 font-sans text-xs font-semibold tracking-widest text-anthracite/80">
              <a href="#creazioni" class="hover:text-gold transition-colors">CREAZIONI</a>
              <a href="#storia" class="hover:text-gold transition-colors">IL LABORATORIO</a>
              <a href="#contatti" class="hover:text-gold transition-colors">CONTATTI</a>
            </nav>
          </header>

          <main>
            <section class="section-pad flex flex-col items-center justify-center min-h-[80vh] text-center max-w-4xl mx-auto">
              <span class="section-label">Laboratorio di Sugar Art</span>
              <h1 class="section-title">L'arte della pasticceria artigianale</h1>
              <p class="font-serif italic text-xl text-gray-600 mb-8 max-w-2xl">
                "Ogni creazione è un pezzo unico, modellato a mano con passione e precisione per rendere indimenticabili i tuoi momenti speciali."
              </p>
              
              <!-- Box Contatore Fedele al tuo Design -->
              <div class="bg-white p-8 rounded-lg shadow-sm border border-gray-100 flex flex-col items-center min-w-[280px] my-4">
                <span class="font-sans text-xs font-bold tracking-widest text-gray-400 uppercase mb-2">Prossimo Aggiornamento</span>
                <div class="stat-num">{count}</div>
                <p class="font-sans text-[11px] text-gray-400 mt-4 max-w-[200px]">
                  Il timer si resetta automaticamente arrivato a zero.
                </p>
              </div>

              <div class="mt-8">
                <a href="#contatti" class="btn-gold">Prenota una consulenza</a>
              </div>
            </section>
          </main>

          <footer class="bg-neutral-900 text-stone-400 py-12 px-6 text-center font-sans text-xs tracking-wider border-t border-neutral-800">
            <p class="mb-2 text-stone-200 font-display tracking-widest text-sm">MAVILO DOLCE</p>
            <p>&copy; 2026 Tutti i diritti riservati. Pasticceria Artigianale e Sugar Art.</p>
          </footer>

        </div>
      );
    }

    // Rendering dell'applicazione
    const container = document.getElementById('root');
    const root = ReactDOM.createRoot(container);
    root.render(
      <React.StrictMode>
        <App />
      </React.StrictMode>
    );
  </script>
</body>
</html>
