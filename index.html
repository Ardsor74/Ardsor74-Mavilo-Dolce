// --- LOGICA GALLERIA DECAP CMS BLINDATA ---
function useCmsGallery() {
  const [items, setItems] = useState(null); // null = loading
  useEffect(() => {
    // Funzione per normalizzare e mappare i dati
    const processData = (rawData) => {
      let entries = [];
      if (Array.isArray(rawData)) {
        entries = rawData;
      } else if (rawData && Array.isArray(rawData.items)) {
        entries = rawData.items;
      } else if (rawData && typeof rawData === 'object') {
        entries = [rawData];
      }
      
      if (entries.length === 0) return [];
      
      return entries.map((item, i) => {
        // Supporta sia item.data.field (Decap CMS) sia item.field diretto
        const d = item.data || item;
        return {
          id: i + 1,
          src: d.image || d.video || d.src || '',
          video: d.video || null,
          link: d.link_esterno || d.link || null,
          tipo: d.tipo || 'foto',
          titolo: d.title || d.titolo || '',
          categoria: d.category || d.categoria || '',
          tall: i % 3 === 0,
        };
      }).filter(item => item.src); // Mostra solo se c'è un'immagine o video valido
    };

    // Tenta prima il file locale, poi prova direttamente da GitHub come fallback estremo
    fetch('/gallery-data.json')
      .then(r => r.ok ? r.json() : Promise.reject())
      .then(data => {
        const mapped = processData(data);
        if (mapped.length > 0) {
          setItems(mapped);
        } else {
          throw new Error("Empty mapped data");
        }
      })
      .catch(() => {
        // Fallback da GitHub pubblico nel caso in cui Netlify non abbia ancora sincronizzato il file locale
        fetch('https://raw.githubusercontent.com/Ardsor74/Ardsor74-Mavilo-Dolce/main/gallery-data.json')
          .then(r => r.ok ? r.json() : [])
          .then(data => {
            const mapped = processData(data);
            setItems(mapped); // Se vuoto, l'app userà automaticamente la galleria vuota gestita
          })
          .catch(() => setItems([]));
      });
  }, []);
  return items;
}

// --- MAIN APP ---
function App() {
  const [nav, setNav] = useState('Atelier');
  const [showPrivacy, setShowPrivacy] = useState(false);
  const [admin, setAdmin] = useState(null);
  const [blocked, setBlocked] = useState(false);

  useEffect(() => {
    const onScroll = () => {
      const sections = [
        { id: 'atelier', label: 'Atelier' },
        { id: 'galleria', label: 'Galleria' },
        { id: 'stampe', label: 'Stampe Alcoliche/Alimentari' },
        { id: 'preventivo', label: 'Preventivo' },
        { id: 'contatti', label: 'Contatti' }
      ];
      let current = sections[0];
      const scrollY = window.scrollY + 200;
      for (const s of sections) {
        const el = document.getElementById(s.id);
        if (el && el.offsetTop <= scrollY) current = s;
      }
      setNav(current.label);
    };
    window.addEventListener('scroll', onScroll, { passive: true });
    onScroll();
    return () => window.removeEventListener('scroll', onScroll);
  }, []);

  const scrollTo = id => setTimeout(() => document.getElementById(id)?.scrollIntoView({behavior:'smooth'}), 50);

  return (
    <>
      <Nav active={nav} setActive={setNav}/>
      <Hero onCTA={() => scrollTo('preventivo')}/>
      <Numbers/>
      <Atelier/>
      <Gallery/>
      <VideoSection/>
      <Testimonial/>
      <StampeAlimentari/>
      <ComeFunziona/>
      <FAQ/>
      <Preventivo blocked={blocked}/>
      <Contatti/>
      <Footer onAdmin={() => setAdmin('login')} onPrivacy={() => setShowPrivacy(true)}/>
      <FloatWA/>
      <CookieBanner onPrivacy={() => setShowPrivacy(true)}/>
      {showPrivacy && <PrivacyModal onClose={() => setShowPrivacy(false)}/>}
      {admin === 'login' && <AdminLogin onOk={() => setAdmin('dash')} onClose={() => setAdmin(null)}/>}
      {admin === 'dash' && <AdminDash onClose={() => setAdmin(null)} blocked={blocked} setBlocked={setBlocked}/>}
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
<script>
  if (window.netlifyIdentity) {
    window.netlifyIdentity.on("init", function(user) {
      if (!user) {
        window.netlifyIdentity.on("login", function() {
          document.location.href = "/admin/";
        });
      }
    });
  }
</script>
</body>
