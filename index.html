<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mavilo Dolce - Laboratorio di Pasticceria Artigianale</title>

  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">

  <style type="text/css">
    :root {
      --color-gold: #C5A059;
      --color-gold-dark: #A3803B;
      --color-anthracite: #2C2C2C;
      --color-warm: #FAF8F5;
      --font-serif: 'Playfair Display', Georgia, serif;
      --font-sans: 'Montserrat', Helvetica, Arial, sans-serif;
      --font-display: 'Cinzel', serif;
    }

    .font-serif { font-family: var(--font-serif); }
    .font-sans { font-family: var(--font-sans); }
    .font-display { font-family: var(--font-display); }
    .text-gold { color: var(--color-gold); }
    .text-anthracite { color: var(--color-anthracite); }
    .bg-warm { background-color: var(--color-warm); }

    .btn-gold {
      background-color: var(--color-gold);
      color: #FFFFFF;
      font-family: var(--font-sans);
      font-weight: 500;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 0.75rem 2rem;
      border-radius: 0.25rem;
      transition: all 0.3s ease;
    }
    .btn-gold:hover {
      background-color: var(--color-gold-dark);
      transform: translateY(-1px);
    }

    .section-pad {
      padding: 5rem 1.5rem;
    }
    @media (min-width: 768px) {
      .section-pad { padding: 7rem 4rem; }
    }

    .section-title {
      font-family: var(--font-display);
      color: var(--color-anthracite);
      font-size: 1.75rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-align: center;
      margin-bottom: 2.5rem;
      text-transform: uppercase;
    }
    @media (min-width: 768px) {
      .section-title { font-size: 2.25rem; }
    }

    .section-label {
      font-family: var(--font-sans);
      color: var(--color-gold);
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      margin-bottom: 0.75rem;
      display: block;
      text-align: center;
    }

    .stat-num {
      font-family: var(--font-display);
      color: var(--color-gold);
      font-size: 3rem;
      font-weight: 400;
      line-height: 1;
    }

    /* Loader / Splash Screen original */
    #loader {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: var(--color-warm);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      opacity: 1;
      visibility: visible;
      transition: opacity 800ms cubic-bezier(0.4, 0, 0.2, 1), visibility 800ms;
    }
    #loader.exit {
      opacity: 0;
      visibility: hidden;
    }
    #loader-logo {
      width: 120px;
      height: auto;
      margin-bottom: 1.5rem;
      animation: pulse 2s infinite ease-in-out;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 0.9; }
      50% { transform: scale(1.03); opacity: 1; }
    }
  </style>
</head>
<body class="bg-warm text-anthracite font-sans antialiased m-0 p-0">

  <div id="root"></div>

  <script type="text/javascript">
    const { useState, useEffect } = React;
    const e = React.createElement;

    function App() {
      const [isLoaderVisible, setIsLoaderVisible] = useState(true);
      const [isLoaderExiting, setIsLoaderExiting] = useState(false);
      const [count, setCount] = useState(10);

      useEffect(() => {
        const exitTimeout = setTimeout(() => {
          setIsLoaderExiting(true);
        }, 3500);

        const removeTimeout = setTimeout(() => {
          setIsLoaderVisible(false);
        }, 4300);

        const counterInterval = setInterval(() => {
          setCount((prevCount) => {
            if (prevCount <= 1) {
              return 10;
            }
            return prevCount - 1;
          });
        }, 1000);

        return () => {
          clearTimeout(exitTimeout);
          clearTimeout(removeTimeout);
          clearInterval(counterInterval);
        };
      }, []);

      // Sfruttiamo htm/createElement nativo per assicurarci che non vada mai in blocco con Tailwind
      return e('div', { id: 'main-content' },
        
        // Loader condizionale
        isLoaderVisible && e('div', { id: 'loader', className: isLoaderExiting ? 'exit' : '' },
          e('img', { 
            id: 'loader-logo', 
            src: "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='40' stroke='%23C5A059' stroke-width='4' fill='none'/></svg>", 
            alt: 'Logo' 
          }),
          e('div', { id: 'loader-sub', className: 'text-anthracite font-serif italic text-lg' }, 'Caricamento in corso...')
        ),

        // Header
        e('header', { className: 'w-full py-6 px-8 border-b border-gray-200/50 flex justify-between items-center bg-white/80 backdrop-blur-md sticky top-0 z-50' },
          e('div', { className: 'font-display font-bold text-xl tracking-wider text-anthracite' }, 'MAVILO DOLCE'),
          e('nav', { className: 'hidden md:flex space-x-8 font-sans text-xs font-semibold tracking-widest text-anthracite/80' },
            e('a', { href: '#creazioni', className: 'hover:text-gold transition-colors' }, 'CREAZIONI'),
            e('a', { href: '#storia', className: 'hover:text-gold transition-colors' }, 'IL LABORATORIO'),
            e('a', { href: '#contatti', className: 'hover:text-gold transition-colors' }, 'CONTATTI')
          )
        ),

        // Contenuto principale
        e('main', null,
          e('section', { className: 'section-pad flex flex-col items-center justify-center min-h-[80vh] text-center max-w-4xl mx-auto' },
            e('span', { className: 'section-label' }, 'Laboratorio di Sugar Art'),
            e('h1', { className: 'section-title' }, "L'arte della pasticceria artigianale"),
            e('p', { className: 'font-serif italic text-xl text-gray-600 mb-8 max-w-2xl' }, 
              '"Ogni creazione è un pezzo unico, modellato a mano con passione e precisione per rendere indimenticabili i tuoi moments speciali."'
            ),
            
            // Box del Contatore Riparato e Indistruttibile
            e('div', { className: 'bg-white p-8 rounded-lg shadow-sm border border-gray-100 flex flex-col items-center min-w-[280px] my-4' },
              e('span', { className: 'font-sans text-xs font-bold tracking-widest text-gray-400 uppercase mb-2' }, 'Prossimo Aggiornamento'),
              e('div', { className: 'stat-num' }, count),
              e('p', { className: 'font-sans text-[11px] text-gray-400 mt-4 max-w-[200px]' }, 'Il timer si resetta automaticamente arrivato a zero.')
            ),

            e('div', { className: 'mt-8' },
              e('a', { href: '#contatti', className: 'btn-gold' }, 'Prenota una consulenza')
            )
          )
        ),

        // Footer
        e('footer', { className: 'bg-neutral-900 text-stone-400 py-12 px-6 text-center font-sans text-xs tracking-wider border-t border-neutral-800' },
          e('p', { className: 'mb-2 text-stone-200 font-display tracking-widest text-sm' }, 'MAVILO DOLCE'),
          e('p', null, '© 2026 Tutti i diritti riservati. Pasticceria Artigianale e Sugar Art.')
        )
      );
    }

    const container = document.getElementById('root');
    const root = ReactDOM.createRoot(container);
    root.render(e(React.StrictMode, null, e(App)));
  </script>
</body>
</html>
