backend:
  name: git-gateway
  branch: main

media_folder: "uploads"
public_folder: "/uploads"

collections:
  - name: "gallery"
    label: "Gallery"
    folder: "_gallery"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Titolo", name: "title", widget: "string" }
      - { label: "Immagine", name: "image", widget: "image", required: false }
      - { label: "Descrizione", name: "description", widget: "text", required: false }
      - label: "Categoria"
        name: "category"
        widget: "select"
        required: false
        options:
          - { label: "Torte Nuziali", value: "nuziale" }
          - { label: "Compleanni", value: "compleanno" }
          - { label: "Comunioni", value: "comunione" }
          - { label: "Sugar Art", value: "sugar_art" }
          - { label: "Stampe Alimentari", value: "stampe" }

  - name: "stampe"
    label: "Stampe Alimentari"
    folder: "_stampe"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Titolo", name: "title", widget: "string" }
      - { label: "Immagine", name: "image", widget: "image", required: false }
      - label: "Tipo"
        name: "tipo"
        widget: "select"
        options:
          - { label: "Ostia (6€)", value: "ostia" }
          - { label: "Pasta di Zucchero (10€)", value: "zucchero" }
      - { label: "Descrizione", name: "description", widget: "text", required: false }
