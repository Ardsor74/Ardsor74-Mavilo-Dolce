backend:
  name: git-gateway
  branch: main

media_folder: uploads
public_folder: /uploads

collections:
  - name: gallery
    label: Galleria
    folder: _gallery
    create: true
    slug: "{{slug}}"
    fields:
      - { name: title, label: Titolo, widget: string }
      - { name: tipo, label: Tipo, widget: select, options: [foto, video] }
      - { name: image, label: Immagine, widget: image, required: false }
      - { name: video, label: Video URL, widget: string, required: false }
      - { name: description, label: Descrizione, widget: text, required: false }
      - { name: category, label: Categoria, widget: string, required: false }
      - { name: link_esterno, label: Link Esterno, widget: string, required: false }
      - { name: evidenza, label: In Evidenza, widget: boolean, default: false }
      - { name: date, label: Data, widget: datetime }